upstream auth_service   { server auth-service:8081;  keepalive 16; }
upstream core_api       { server core-api:8082;       keepalive 32; }
upstream ai_service     { server ai-service:8083;     keepalive 16; }
upstream frontend_app   { server frontend:80;          keepalive 16; }

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ── Gateway health check ─────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── AI service — most specific routes first ──────────────────

    # All /api/v1/ai/* endpoints
    location ~ ^/api/v1/ai/ {
        proxy_pass            http://ai_service;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      Connection        "";
        proxy_read_timeout    180s;
        proxy_send_timeout    30s;
        proxy_buffering       off;
    }

    # Code execution
    location = /api/v1/execute {
        proxy_pass            http://ai_service;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      Connection        "";
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    # Path adaptation
    location ~ ^/api/v1/paths/[^/]+/adapt(/.*)?$ {
        proxy_pass            http://ai_service;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      Connection        "";
        proxy_read_timeout    180s;
        proxy_send_timeout    30s;
        proxy_buffering       off;
    }

    # Module AI content generation
    location ~ ^/api/v1/modules/[^/]+/content(/.*)?$ {
        proxy_pass            http://ai_service;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      Connection        "";
        proxy_read_timeout    180s;
        proxy_send_timeout    30s;
        proxy_buffering       off;
    }

    # Quiz — GET (generate) and POST (submit) both handled by ai-service
    location ~ ^/api/v1/modules/[^/]+/quiz(/.*)?$ {
        proxy_pass            http://ai_service;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      Connection        "";
        proxy_read_timeout    180s;
        proxy_send_timeout    30s;
    }

    # ── Auth service ─────────────────────────────────────────────
    location ~ ^/api/v1/auth/ {
        proxy_pass            http://auth_service;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      Connection        "";
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── Core API — everything else under /api/ ───────────────────
    location /api/ {
        proxy_pass            http://core_api;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      Connection        "";
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    # ── Frontend SPA ─────────────────────────────────────────────
    location / {
        proxy_pass            http://frontend_app;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      Connection        "";
        proxy_read_timeout    30s;
    }

    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
}
