# Lumintora — Docker Compose
#
# Usage:
#   ./start.sh          — first run (builds images, starts everything)
#   docker compose up   — subsequent starts
#   docker compose down — stop without removing data
#   docker compose down -v — stop AND wipe the database
#
# Copy .env.example → .env and fill in secrets before deploying to production.

services:
  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lumintora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-lumintora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lumintora_secret}
      POSTGRES_DB:       ${DB_NAME:-lumintora}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lumintora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lumintora-net

  # ── Go API ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumintora-api
    restart: unless-stopped
    environment:
      DB_HOST:      postgres
      DB_PORT:      5432
      DB_USER:      ${DB_USER:-lumintora}
      DB_PASSWORD:  ${DB_PASSWORD:-lumintora_secret}
      DB_NAME:      ${DB_NAME:-lumintora}
      PORT:         8080
      JWT_SECRET:   ${JWT_SECRET:-change_me_in_production}
      CF_AI_URL:    ${CF_AI_URL:-https://lumintora-ai.bobbynandigam-official.workers.dev}
      CODE_EXEC_URL: ${CODE_EXEC_URL:-https://wandbox.org}
      # nginx proxies /api → backend on the same origin, so CORS is only
      # needed for direct host access (e.g. curl, Postman).
      CORS_ORIGIN:  ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 8s
    # Backend is NOT exposed to the host — all traffic goes through nginx.
    # Uncomment the line below if you need direct API access (dev/debug).
    # ports: ["8080:8080"]
    networks:
      - lumintora-net

  # ── nginx + React SPA ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string → relative URLs → nginx proxies /api to the backend.
        # Set to a full URL only if you serve API and frontend from different hosts.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: lumintora-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumintora-net

volumes:
  pgdata:

networks:
  lumintora-net:
    driver: bridge
