# Spins up a local PostgreSQL instance for development.
# Migrations are auto-applied via docker-entrypoint-initdb.d (first run only).
# For subsequent migrations run: scripts/setup-local-db.sh

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumintora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-lumintora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lumintora_secret}
      POSTGRES_DB:       ${DB_NAME:-lumintora}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lumintora}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
